<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: "What should the lesson page look like?"
  Verdict so far (Omer): the combined layout — track sidebar (typographic index, collapsible), Chat/Lesson switch,
  step timeline in the lesson's left gutter, continuous steps that unlock as checks pass, Google-Docs-style margin cards.
  Variants A–C (docs margin / focus reader / paged steps) were explored and dropped.
  Try: select any text → "Ask" · answer the step-2 check (first answer always "misses")
       · type "i don't know" twice for the pause / continue-anyway gate · pink bar: theme, jump to end, 3 ↔ 18 tracks.
  Run: python3 -m http.server 4817 (in this folder), then open http://localhost:4817/
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson Page Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #111214; --bg-2: #17181b; --bg-3: #1e2024; --line: #2a2c31; --line-2: #34373d;
    --text: #e6e4df; --text-2: #a9a7a1; --text-3: #75736e;
    --accent: #e0a458; --accent-soft: rgba(224,164,88,.14); --accent-line: rgba(224,164,88,.45);
    --good: #7fb88a; --bad: #d98572;
    --serif: "Source Serif 4", Georgia, serif; --sans: Inter, system-ui, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fbfaf7; --bg-2: #f3f1ec; --bg-3: #ebe8e1; --line: #e2ded5; --line-2: #d3cec3;
    --text: #22211e; --text-2: #5d5a53; --text-3: #8d8980;
    --accent: #b8741f; --accent-soft: rgba(184,116,31,.10); --accent-line: rgba(184,116,31,.45);
    --good: #3f7f4d; --bad: #b0513c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  /* ---------- shared lesson typography ---------- */
  .prose { font-family: var(--serif); font-size: 19px; line-height: 1.65; }
  .prose p { margin: 0 0 1em; }
  .prose h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; line-height: 1.25; margin: 0 0 .6em; letter-spacing: -.01em; }
  .prose code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .82em; background: var(--bg-3); padding: .1em .35em; border-radius: 4px; }
  .step-kicker { font-family: var(--sans); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
  mark.hl { background: var(--accent-soft); color: inherit; border-bottom: 2px solid var(--accent-line); cursor: pointer; padding: 0 1px; border-radius: 2px; }
  mark.hl.active { background: rgba(224,164,88,.28); }
  figure.diagram { margin: 1.6em 0; padding: 22px 18px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); }
  figure.diagram .mermaid-out { display: flex; justify-content: center; min-height: 60px; }
  figure.diagram .mermaid-out svg { max-width: 100%; height: auto; }
  figcaption { font-family: var(--sans); font-size: 13.5px; color: var(--text-2); margin-top: 12px; text-align: center; }

  .stepper .frame-cap { font-family: var(--sans); font-size: 14px; color: var(--text); text-align: center; min-height: 42px; margin-top: 10px; }
  .stepper .controls { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 10px; font-family: var(--sans); font-size: 13px; color: var(--text-2); }
  .stepper .controls button { border: 1px solid var(--line-2); background: var(--bg-3); border-radius: 6px; padding: 4px 10px; }
  .stepper .controls button:disabled { opacity: .35; cursor: default; }
  .stepper input[type=range] { width: 160px; accent-color: var(--accent); }

  .check { font-family: var(--sans); margin: 1.8em 0 1em; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-2); overflow: hidden; }
  .check .q { padding: 16px 18px 12px; font-family: var(--serif); font-size: 18px; line-height: 1.5; }
  .check .q .lbl { display: block; font-family: var(--sans); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .check .row { display: flex; gap: 8px; padding: 0 12px 12px; }
  .check input[type=text] { flex: 1; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; color: var(--text); font: inherit; outline: none; }
  .check input[type=text]:focus { border-color: var(--accent-line); }
  .check .btn { border: 1px solid var(--line-2); background: var(--bg-3); border-radius: 8px; padding: 0 12px; }
  .check .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1408; font-weight: 600; }
  .thread { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { font-size: 14.5px; line-height: 1.55; }
  .msg .who { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .msg.you .body { color: var(--text-2); }
  .msg.tutor .body { font-family: var(--serif); font-size: 16.5px; }
  .verdict { font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .verdict.bad { color: var(--bad); } .verdict.good { color: var(--good); }
  .gate { display: flex; gap: 8px; flex-wrap: wrap; }
  .gate button { border: 1px solid var(--line-2); background: var(--bg-3); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }
  .gate .hint { width: 100%; font-size: 12.5px; color: var(--text-3); }
  .note { font-family: var(--sans); font-size: 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 1em 0; }
  .note b { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }

  .locked { font-family: var(--sans); border: 1px dashed var(--line-2); border-radius: 12px; padding: 22px; text-align: center; color: var(--text-3); margin: 2em 0; }
  .locked .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .locked .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
  .locked .dots i.on { background: var(--accent); }
  .built { margin-top: 2.5em; }
  .built .step-kicker { color: var(--accent); }
  .homework-cta { font-family: var(--sans); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; margin: 1.5em 0 4em; }
  .homework-cta button { background: var(--accent); color: #1a1408; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; }

  /* aside card */
  .card { font-family: var(--sans); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
  .card::before { content: ""; display: block; height: 4px; background: var(--accent); opacity: .85; }
  .card:hover { transform: rotate(-.4deg) translateY(-1px); box-shadow: 0 10px 28px rgba(0,0,0,.24); }
  .card.active { border-color: var(--accent-line); }
  .card .inner { padding: 10px 12px 12px; }
  .card .quote { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--text-3); border-left: 2px solid var(--line-2); padding-left: 8px; margin-bottom: 8px; }
  .card .msg { font-size: 13.5px; } .card .msg.tutor .body { font-size: 15px; }
  .card .msg + .msg { margin-top: 8px; }
  .card .follow { display: flex; gap: 6px; margin-top: 10px; }
  .card .follow input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .card .later { font-size: 12px; color: var(--accent); margin-top: 6px; }
  .card .foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); margin-top: 8px; }
  .card .foot button { background: none; border: 0; color: var(--text-3); padding: 0; font-size: 11.5px; }
  .ask-pop { position: absolute; z-index: 50; font-family: var(--sans); background: var(--text); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.3); display: none; gap: 6px; align-items: center; }
  .ask-pop input { background: transparent; border: 0; outline: none; color: var(--bg); font: inherit; font-weight: 400; width: 220px; }
  .ask-pop input::placeholder { color: color-mix(in srgb, var(--bg) 60%, transparent); }

  /* ---------- Variant D: combined (track sidebar, Chat/Lesson switch, gutter timeline, continuous steps, margin cards) ---------- */
  .D { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .D.collapsed { grid-template-columns: 0 1fr; } .D.collapsed .sidebar { visibility: hidden; padding: 0; border: 0; }
  .D .stage { display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }
  .D .top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); }
  .D .top .row { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .D .sb-toggle { width: 32px; height: 32px; border: 0; background: none; color: var(--text-3); border-radius: 6px; font-size: 16px; }
  .D .sb-toggle:hover { background: var(--bg-2); color: var(--text-2); }
  .D .tabs { display: flex; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .D .tabs button { border: 0; background: none; padding: 5px 16px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
  .D .tabs button.on { background: var(--bg-3); color: var(--text); }
  /* text column truly centred when there is room; the right column never gets narrower than a card,
     so on tighter screens the text slides left only as far as the cards need (Google Docs behaviour) */
  .D .page { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 68ch) minmax(340px, 1fr); padding: 40px 0 96px; }
  .D .page .col { grid-column: 2; padding: 0 8px; }
  .D .margin { position: relative; grid-column: 3; margin-left: 40px; max-width: 300px; }
  .D .step > .step-kicker { display: none; }
  .D .step + .step { border-top: 1px solid var(--line); margin-top: 32px; padding-top: 40px; }
  .D section.step, #built-anchor { scroll-margin-top: 68px; }
  /* gutter timeline: only exists in Lesson view; shrinks to dots when the gutter is narrow */
  .D .gutter { grid-column: 1; container-type: inline-size; display: flex; justify-content: flex-end; padding-right: 40px; }
  .D .gutter .timeline { position: sticky; top: 92px; align-self: flex-start; width: 210px; font-size: 13px; }
  .D .gutter .t-title { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; line-height: 1.4; }
  .D .tl { position: relative; padding-left: 20px; }
  .D .tl::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px; background: var(--line-2); }
  .D .tl .n { position: relative; padding: 5px 0; color: var(--text-3); line-height: 1.35; }
  .D .tl .n::before { content: ""; position: absolute; left: -19px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line-2); }
  .D .tl .n.done { color: var(--text-2); cursor: pointer; } .D .tl .n.done::before { background: var(--accent); border-color: var(--accent); }
  .D .tl .n.done:hover { color: var(--text); }
  .D .tl .n.cur { color: var(--text); font-weight: 500; } .D .tl .n.cur::before { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .D .tl .n.flag span::after { content: " · settling"; color: var(--accent); font-size: 11.5px; font-weight: 400; }
  @container (max-width: 250px) {
    .D .gutter .timeline { width: 20px; } .D .gutter .t-title, .D .tl .n span { display: none; }
    .D .tl .n { height: 22px; }
  }
  /* chat view */
  .D .chat { max-width: 68ch; width: 100%; margin: 0 auto; padding: 36px 24px 120px; display: flex; flex-direction: column; gap: 18px; }
  .D .cmsg { max-width: 85%; }
  .D .cmsg .who { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .D .cmsg .body { font-size: 15px; line-height: 1.6; }
  .D .cmsg.you { align-self: flex-end; } .D .cmsg.you .body { background: var(--bg-3); border-radius: 12px; padding: 9px 13px; color: var(--text); }
  .D .cmsg.tutor .body { font-family: var(--serif); font-size: 17px; }
  .D .cmsg .approved { font-size: 12.5px; color: var(--good); margin-top: -4px; }
  .D .composer input { width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--text-3); font: inherit; }
  @media (max-width: 1100px) { .D .page { grid-template-columns: minmax(16px, 1fr) minmax(0, 68ch) minmax(16px, 1fr); } .D .margin, .D .gutter .timeline { display: none; } }
  @media (max-width: 760px) { .D { grid-template-columns: 1fr; } .D .sidebar { display: none; } }

  /* first-time hint in the empty margin */
  .hint-card { position: sticky; top: 92px; font-size: 13px; line-height: 1.5; color: var(--text-3); border: 1px dashed var(--line-2); border-radius: 10px; padding: 12px 14px; }
  .hint-card b { color: var(--text-2); font-weight: 500; }
  .hint-demo { font-family: var(--serif); font-size: 13.5px; color: var(--text-3); margin-bottom: 8px; }
  .hint-sel { background: var(--accent-soft); color: var(--text-2); border-radius: 2px; animation: hintsel 2.6s ease-in-out infinite; background-size: 0% 100%; }
  @keyframes hintsel { 0%, 15% { background-color: transparent; } 35%, 80% { background-color: var(--accent-soft); box-shadow: 0 2px 0 var(--accent-line); } 100% { background-color: transparent; } }
  /* ---------- track sidebar (refined "typographic index") ---------- */
  .sidebar { width: 248px; border-right: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .sb-top { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .sb-new { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 1px dashed var(--accent-line); background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 500; }
  .sb-new:hover { border-style: solid; }
  .sb-search { position: relative; }
  .sb-search input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line-2); padding: 6px 28px 7px 0; color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .sb-search input:focus { border-bottom-color: var(--accent-line); }
  .sb-search kbd { position: absolute; right: 0; top: 6px; font: 11px var(--sans); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; }
  .sb-scroll { flex: 1; overflow: auto; padding: 6px 14px 16px; }
  .sb-label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 14px 0 4px; }
  .sb-track { border-top: 1px solid var(--line); }
  .sb-track:first-of-type { border-top: 0; }
  .sb-track > .head { display: flex; align-items: baseline; gap: 8px; padding: 9px 0 8px; cursor: pointer; }
  .sb-track > .head h3 { flex: 1; min-width: 0; margin: 0; font-family: var(--serif); font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-track > .head:hover h3, .sb-track.open > .head h3 { color: var(--text); }
  .sb-track > .head .meta { font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .sb-track > .head .meta.due { color: var(--accent); }
  .sb-track.current > .head h3 { font-size: 17px; }
  .sb-track ol { list-style: none; margin: 0 0 8px; padding: 0; }
  .sb-track li { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .sb-track li .k { grid-column: 1 / -1; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
  .sb-track li .t { font-size: 13.5px; color: var(--text-2); }
  .sb-track li.done .t { color: var(--text-3); }
  .sb-track li.current { box-shadow: inset 2px 0 0 var(--accent); padding-left: 10px; margin-left: -10px; }
  .sb-track li.current .t { color: var(--text); font-weight: 500; }
  .sb-track li:hover .t { color: var(--text); }
  .sb-track li .due { font-size: 11px; color: var(--accent); align-self: end; }
  .sb-track .done-toggle { font-size: 11.5px; color: var(--text-3); padding: 4px 0 8px; cursor: pointer; }
  .sb-track .done-toggle:hover { color: var(--text-2); }
  .sb-more { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; font-size: 12.5px; color: var(--text-3); }
  .sb-more:hover { color: var(--text-2); }
  .sb-empty { font-size: 12.5px; color: var(--text-3); padding: 10px 0; }
  .sb-foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
  .sb-foot .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; font-size: 11.5px; }
  .sb-foot .gear { margin-left: auto; color: var(--text-3); }

  /* ---------- prototype switcher (not part of the design) ---------- */
  .proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; gap: 4px; background: #ff3d7f; color: #fff; border-radius: 999px; padding: 5px; font: 600 12.5px/1 Inter, system-ui, sans-serif; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .proto-bar button { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 999px; padding: 7px 11px; font-weight: 600; }
  .proto-bar button:hover { background: rgba(255,255,255,.3); }
  .proto-bar .lbl { padding: 0 10px; min-width: 150px; text-align: center; }
  .proto-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.35); margin: 0 4px; }

  @media (max-width: 760px) { .prose { font-size: 17.5px; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="ask-pop" id="askPop"><span>Ask</span><input id="askInput" placeholder="what's unclear here?" /></div>
<div class="proto-bar" id="protoBar"></div>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

/* ================= fake lesson data (as the server's block tree would hold it) ================= */
const LESSON = {
  track: "How software works",
  title: "When two workers touch the same number",
  totalSteps: 5,
  steps: [
    {
      id: "s1", heading: "Adding one is three moves, not one",
      blocks: [
        { t: "p", id: "b1", html: `You told me earlier that <em>"the computer just adds one to the number"</em>. That's true, and it hides something. The number lives in memory, and the part of the machine that does arithmetic can't reach into memory and change a value where it sits.` },
        { t: "p", id: "b2", html: `So to add one, it has to do three separate things: copy the value out, change the copy, and put the copy back. Each of those is a move of its own, and nothing forces the three to happen back to back.` },
        { t: "diagram", id: "b3", caption: "Adding one to a number in memory takes three separate moves.", src:
`flowchart LR
  M[("memory: 5")] -->|copy out| R["working copy: 5"]
  R -->|change| C["working copy: 6"]
  C -->|put back| M2[("memory: 6")]
  class R,C hl` },
        { t: "p", id: "b4", html: `Keep that gap in mind: between copying the value out and putting it back, the value in memory is still the old one.` },
      ],
      check: { q: "In one sentence: what is in memory while the working copy is being changed?", scripted: "pass" },
    },
    {
      id: "s2", heading: "Two workers, one number",
      blocks: [
        { t: "p", id: "b5", html: `Now give the same job to two workers at once. Each one does its own three moves. Remember, the three moves of one worker don't have to happen back to back, so the other worker's moves can land in between.` },
        { t: "p", id: "b6", html: `Step through what can happen when the number starts at 5 and both workers add one:` },
        { t: "stepper", id: "b7", frames: [
          { cap: "The number in memory is 5. Neither worker has started.", src: `flowchart LR\n  A["worker A: idle"] ~~~ M[("memory: 5")] ~~~ B["worker B: idle"]` },
          { cap: "Worker A copies the value out. Its working copy is 5.", src: `flowchart LR\n  M[("memory: 5")] -->|copies 5| A["worker A: 5"]\n  M ~~~ B["worker B: idle"]\n  class A hl` },
          { cap: "Before A puts anything back, worker B copies the value out too. It also sees 5.", src: `flowchart LR\n  A["worker A: 5"] ~~~ M[("memory: 5")]\n  M -->|copies 5| B["worker B: 5"]\n  class B hl` },
          { cap: "Worker A adds one and puts 6 back.", src: `flowchart LR\n  A["worker A: 6"] -->|puts back 6| M[("memory: 6")]\n  M ~~~ B["worker B: 5"]\n  class A hl` },

function layoutMarginCards() {

  margin.querySelectorAll(".connector").forEach((c) => c.remove());
  const base = margin.getBoundingClientRect().top;
  let lastBottom = 0;
  for (const a of S.asides) {
    const card = margin.querySelector(`[data-card="${a.id}"]`);
    const anchor = col.querySelector(`mark[data-aside="${a.id}"]`) || col.querySelector(`[data-block="${a.blockId}"]`);
    if (!card || !anchor) { if (card) card.style.display = "none"; continue; }
    const r = anchor.getBoundingClientRect();
    const top = Math.max(r.top - base - 8, lastBottom + 12);
    card.style.top = top + "px";
    lastBottom = top + card.offsetHeight;
    const conn = document.createElement("div");
    conn.className = "connector";
    const colRight = col.getBoundingClientRect().right, mLeft = margin.getBoundingClientRect().left;
    conn.style.top = (r.top - base + r.height / 2) + "px";
    conn.style.left = (colRight - mLeft - (colRight - r.right)) + "px";
    conn.style.width = (colRight - r.right) + (mLeft - colRight) + "px";

const pop = document.getElementById("askPop"), askInput = document.getElementById("askInput");
let pendingSel = null;
document.addEventListener("mouseup", (e) => {
  if (pop.contains(e.target)) return;
  const sel = getSelection(); const txt = sel.toString().trim();
  const p = sel.anchorNode && sel.anchorNode.parentElement?.closest("[data-block]");
  if (!txt || txt.length < 3 || !p) { pop.style.display = "none"; return; }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  pendingSel = { blockId: p.dataset.block, quote: txt, range: sel.getRangeAt(0).cloneRange() };
  pop.style.display = "flex"; pop.style.left = (r.left + scrollX) + "px"; pop.style.top = (r.bottom + scrollY + 8) + "px";
  askInput.value = ""; setTimeout(() => askInput.focus(), 0);
});
askInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { pop.style.display = "none"; return; }
  if (e.key !== "Enter" || !askInput.value.trim() || !pendingSel) return;
  const id = "a" + (S.asides.length + 1 + Math.floor(Math.random() * 1e4));
  const block = LESSON.steps.flatMap((s) => s.blocks).find((b) => b.id === pendingSel.blockId);
  if (block && block.html.includes(pendingSel.quote) && !block.html.includes(`data-aside`)) {
    block.html = block.html.replace(pendingSel.quote, `<mark class="hl" data-aside="${id}">${pendingSel.quote}</mark>`);
  } else if (block && block.html.includes(pendingSel.quote)) {
    block.html = block.html.replace(pendingSel.quote, `<mark class="hl" data-aside="${id}">${pendingSel.quote}</mark>`);
  }
  const later = /lock|fix|prevent|stop/i.test(askInput.value);
  const a = { id, blockId: pendingSel.blockId, quote: pendingSel.quote, thread: [{ who: "you", text: esc(askInput.value) }], later };
  const m = { who: "tutor", text: "" }; a.thread.push(m);
  S.asides.push(a); S.activeAside = id;
  pop.style.display = "none"; getSelection().removeAllRanges();
  stream(m, later
    ? "A small taste: the fix is to make sure only one worker can be inside those three moves at a time. How that's done is exactly what the lesson builds next, so hold the thought."
    : "Good question. Here it just means the value that sits in memory, as opposed to the copy a worker is holding while it works. Only the one in memory is shared; each worker's copy is private to it.");
});

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-jumpto], [data-toggle-track], [data-show-done], mark.hl, .card"); if (!t) return;
  const d = t.dataset;
  if (d.theme !== undefined) { S.theme = S.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = S.theme; localStorage.setItem("proto-theme", S.theme); initMermaid(); return render(); }
  if (d.jump !== undefined) {
    if (S.complete) { location.reload(); return; }
    S.complete = true; LESSON.steps.forEach((s) => (S.passed[s.id] = true)); return render();
  }
  if (d.submit) { const inp = document.querySelector(`[data-answer="${d.submit}"]`); if (inp.value.trim()) answer(d.submit, inp.value.trim()); return; }
  if (d.idk) return answer(d.idk, "I don't know");
  if (d.pause) { alertless(`Session paused at this check. Next time it opens with a fresh question on the same idea.`, d.pause); return; }
  if (d.continue) { S.flagged[d.continue] = true; S.gate[d.continue] = false; pass(d.continue); return; }
  if (d.sprev || d.snext) { const id = d.sprev || d.snext; const b = LESSON.steps.flatMap((s) => s.blocks).find((x) => x.id === id); stepperPos[id] = Math.max(0, Math.min(b.frames.length - 1, (stepperPos[id] ?? 0) + (d.snext ? 1 : -1))); return render(); }
  if (d.many !== undefined) { S.manyTracks = !S.manyTracks; S.showAllTracks = false; const u = new URL(location); u.searchParams.set("tracks", S.manyTracks ? "many" : "few"); history.replaceState(null, "", u); return render(); }
  if (d.toggleTrack) { S.expanded.has(d.toggleTrack) ? S.expanded.delete(d.toggleTrack) : S.expanded.add(d.toggleTrack); return render(); }
  if (d.showDone) { S.showDone.add(d.showDone); return render(); }
  if (d.moreTracks !== undefined) { S.showAllTracks = !S.showAllTracks; return render(); }
  if (d.sidebar !== undefined) { S.sidebar = !S.sidebar; return render(); }
  if (d.view) { S.view = d.view; return render().then(() => scrollTo(0, 0)); }
  if (d.jumpto) { if (S.view !== "lesson") { S.view = "lesson"; render().then(() => document.querySelector(`section[data-step="${d.jumpto}"]`)?.scrollIntoView({ block: "start" })); return; } const el = d.jumpto === "built" ? document.getElementById("built-anchor") : document.querySelector(`section[data-step="${d.jumpto}"]`); el?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.save) { t.textContent = "saved ✓"; return; }
  if (t.matches("mark.hl")) { S.activeAside = t.dataset.aside; return render(); }
  if (t.matches(".card")) { if (S.activeAside !== d.card) { S.activeAside = d.card; render(); } }
});
function alertless(msg, stepId) {
  const th = S.checkThreads[stepId]; th.push({ who: "tutor", text: `<i>${msg}</i>` }); S.gate[stepId] = false; S.passed[stepId] = false; render();
}
document.addEventListener("input", (e) => {
  if (e.target.dataset.sbSearch !== undefined) { filterSidebar(e.target.value); return; }
  if (e.target.dataset.srange) { stepperPos[e.target.dataset.srange] = +e.target.value; render(); }
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.closest("input, textarea, [contenteditable]");
  if (e.key === "Enter" && e.target.dataset.answer) { if (e.target.value.trim()) answer(e.target.dataset.answer, e.target.value.trim()); return; }
  if (e.key === "Enter" && e.target.dataset.follow && e.target.value.trim()) {
    const a = S.asides.find((x) => x.id === e.target.dataset.follow);
    a.thread.push({ who: "you", text: esc(e.target.value.trim()) }); const m = { who: "tutor", text: "" }; a.thread.push(m);
    stream(m, "Right. And that's why the order matters: whichever worker puts its copy back last wins, and the other one's work is simply gone."); return;
  }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); document.querySelector("[data-sb-search]")?.focus(); }
});
addEventListener("resize", () => VARIANTS[S.variant].after?.());

initMermaid();
render();
</script>
</body>
