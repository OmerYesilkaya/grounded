<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under a phone's rounded corners and home bar, which
         the layout keeps clear with env(safe-area-inset-*); resizes-content has an on-screen
         keyboard shrink the page (Android), so the box being typed in stays above it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The browser's own bar in the page's background; src/lib/theme.ts keeps it in step. -->
    <meta name="theme-color" content="#111214" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Notable&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Grounded</title>
    <script>
      // The learner's theme before the first paint, so a light page never flashes dark. The same
      // key and rules as src/lib/theme.ts, which takes over once the app loads.
      try {
        const choice = localStorage.getItem("grounded:theme");
        const light =
          choice === "light" ||
          (choice === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
